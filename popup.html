<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Amazon Unit Price Sort</title>
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.45 system-ui, -apple-system, sans-serif;
        color: #134e4a;
        background: #f0fdfa;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
        color: #0f766e;
      }
      p,
      li {
        margin: 0 0 8px;
        color: #115e59;
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      .note {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #ccfbf1;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Unit Price Sort</h1>
    <p><strong>Pin the extension</strong>, then click the icon to show/hide the overlay.</p>
    <ul>
      <li>On search pages: <strong>Sort Now</strong> ranks by $/unit</li>
      <li>Overlay <strong>Disable</strong> = same as toolbar OFF</li>
      <li>Badge shows <strong>OFF</strong> when disabled</li>
    </ul>
    <div class="note">
      No popup on icon click (toggle only). Nothing shopping-related is saved.
    </div>
  </body>
</html>
